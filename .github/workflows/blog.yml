name: Daily Blog Post

on:
  schedule:
    # GitHub UTC use karta hai. 02:30 UTC = 08:00 AM IST
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run / draft / publish"
        type: choice
        default: "dry-run"
        options: [dry-run, draft, publish]

permissions:
  contents: write

concurrency:
  group: blog-agent
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/agent.py --mode "${{ github.event.inputs.mode || 'publish' }}"

      - name: Preview upload (dry-run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: output/preview.html
          if-no-files-found: ignore

      - name: Save state.json and images
        run: |
          git config user.name "blog-agent"
          git config user.email "blog-agent@users.noreply.github.com"
          git add state.json images/
          if git diff --cached --quiet; then
            echo "Kuch naya nahi hai."
            exit 0
          fi
          git diff --cached --name-only -- images/ > /tmp/purge-images.txt
          git commit -m "chore: update state and images [skip ci]"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              pushed=1
              echo "Push ho gaya (attempt $i)."
              break
            fi
            echo "Push fail (attempt $i), retry kar rahe hain..."
            sleep $((i * 10))
          done
          if [ "$pushed" != "1" ]; then
            echo "ERROR: 5 retries ke baad bhi push fail. Image live nahi hogi."
            exit 1
          fi

      - name: Purge jsDelivr cache for new images
        run: |
          if [ ! -f /tmp/purge-images.txt ]; then
            echo "No new images to purge."
            exit 0
          fi
          while read -r f; do
            [ -z "$f" ] && continue
            NAME=$(basename "$f")
            echo "Purging jsDelivr cache: $NAME"
            for i in 1 2 3; do
              curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/images/$NAME" && break
              sleep 5
            done
            echo
          done < /tmp/purge-images.txt
